<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedCentral | Review Requests</title>
  <link rel="stylesheet" href="/global.css">
  <link rel="stylesheet" href="/wh_manager/sidebar.css">
  <link rel="stylesheet" href="/wh_manager/orders/review_requests.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
  <div class="page-container">
    <nav class="sidebar"></nav>

    <main class="main-content">

      <header class="top-header">
        <img src="/images/MedCentral_logo_small.png" alt="MedCentral Logo" class="logo">
        <h1>Request Approval Queue</h1>
        <div class="badge-count">8 Pending Requests</div>
      </header>

      <section class="request-container">

        <div class="request-card">
          <div class="request-header">
            <div class="hospital-meta">
              <span class="hospital-name">Aga Khan University Hospital</span>
              <span class="request-id">REQ-4402</span>
            </div>

            <div class="time-tracking">
                <i class="far fa-clock"></i>
                <span>Created: Jan 04, 08:15 AM</span>
            </div>

            <div class="order-total-badge">
              <small>Total Amount:</small>
              <span class="total-amt">$4,250.00</span>
            </div>
          </div>

          <div class="request-body">
            <table class="item-review-table">
              <thead>
                <tr>
                  <th>Item Requested</th>
                  <th>Unit Price</th>
                  <th>Quantity</th>
                  <th>Warehouse Stock</th>
                  <th>Subtotal</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>Paracetamol 500mg</td>
                  <td>$10.00</td>
                  <td>50 Boxes</td>
                  <td><span class="text-success">450 Boxes</span></td>
                  <td><strong>$500.00</strong></td>
                </tr>
                <tr>
                  <td>Surgical Gloves (M)</td>
                  <td>$18.75</td>
                  <td>200 Pairs</td>
                  <td><span class="text-danger">180 Pairs</span></td>
                  <td><strong>$3,750.00</strong></td>
                </tr>
              </tbody>
            </table>
          </div>

          <div class="request-footer">
            <div class="denial-reason">
              <input type="text" placeholder="Reason for denial..." id="note-4402">
            </div>
            <div class="action-buttons">
              <button class="btn-deny" onclick="handleAction('deny', '4402')">Deny</button>
              <button class="btn-approve" onclick="handleAction('approve', '4402')">Approve & Send Invoice</button>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="/wh_manager/orders/review_requests.js"></script>
</body>

</html>
