<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Master Order Log | Medical Logistics</title>

  <link rel="stylesheet" href="/wh_manager/orders/orders_requests.css">
  <link rel="stylesheet" href="/global.css">
  <link rel="stylesheet" href="/wh_manager/sidebar.css">
  <link rel="stylesheet" href="/wh_manager/orders/overlay.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>

  <div class="page-container">
    <nav class="sidebar"></nav>

    <div class="master-container">
      <header class="logo-container"></header>

      <div class="log-header">
        <h2><i class="fas fa-archive"></i> Orders Log</h2>
        <div class="log-stats">
          <div class="stat-card"><span>Total Orders:</span> <strong>1,240</strong></div>
          <div class="stat-card"><span>In Transit:</span> <strong class="blue">85</strong></div>
          <div class="stat-card"><span>Completed:</span> <strong class="green">1,150</strong></div>
        </div>
      </div>

      <div class="log-controls">
        <div class="search-box">
          <i class="fas fa-search"></i>
          <input type="text" placeholder="Search Hospital, ID, or Items...">
        </div>
        <select class="log-select">
          <option>All Statuses</option>
          <option>Pending</option>
          <option>Dispatched</option>
          <option>Delivered</option>
        </select>
        <button class="export-btn"><i class="fas fa-file-export"></i> Export CSV</button>
      </div>

      <div class="table-wrapper">
        <table class="master-table">
          <thead>
            <tr>
              <th>Order ID</th>
              <th>Destination</th>
              <th>Packages</th>
              <th>Creation Date</th>
              <th>Payment Date</th>
              <th>Delivered</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody class="js-orders-table"></tbody>
        </table>
      </div>

      <div class="overlay" id="packages-overlay">
        <div class="packages-details-container">
          <div class="details-header">
            <h3><i class="fas fa-box-open"></i> Order Progress: <span class="order-id"></span></h3>
            <button class="close-btn js-close-overlay-btn">&times;</button>
          </div>

          <div class="details-body">
            <p class="destination-text">
              <strong>Destination:</strong> 
              <span class="js-destination"></span>
            </p>

            <table class="package-status-table">
              <thead>
                <tr>
                  <th>Package ID</th>
                  <th>No. of Items</th>
                  <th>Processing</th>
                  <th>Ready</th>
                  <th>In Transit</th>
                  <th>Completed</th>
                </tr>
              </thead>
              <tbody class="js-packages-table"></tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script type="module" src="/wh_manager/orders/order_requests.js"></script>
</body>

</html>
