<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assign Driver | MedCentral</title>
  <link rel="stylesheet" href="/global.css">
  <link rel="stylesheet" href="/wh_manager/sidebar.css">
  <link rel="stylesheet" href="/wh_manager/orders/assign_to_driver.css">

  <script src="https://kit.fontawesome.com/d41551dbdd.js" crossorigin="anonymous"></script>
</head>

<body>
  <div class="page-container">
    <nav class="sidebar"></nav>

    <main class="main-content">
      <header class="logo-container"></header>

      <h2>Dispatch Center</h2>
      <div class="stat">4 Orders Ready to Ship</div>

      <section class="dispatch-grid">
        <div class="dispatch-card" data-location="Upper Hill">
          <div class="card-badge"><i class="fa-solid fa-house-medical-circle-check"></i></div>
          <div class="card-main">
            <div class="order-meta">
              <span class="order-no">#ORD-2026-102</span>
              <h3>Aga Khan University Hospital</h3>
              <p class="location-tag"><i class="fas fa-map-marker-alt"></i> Parklands, Nairobi</p>
            </div>

            <div class="package-details">
              <div class="detail-item">
                <button class="view-items-btn">
                  <i class="fas fa-boxes"></i>
                  <span class="no-of-items">3 Items</span>
                  <span class="view-items-text">View items</span>
                </button>
              </div>
              <div class="detail-item">
                <i class="fas fa-weight-hanging"></i>
                <span>18.5 kg</span>
              </div>
            </div>
          </div>

          <div class="assignment-footer">
            <label>Assign Driver</label>
            <div class="action-row">
              <select class="driver-select">
                <option value="">Select Driver...</option>
                <option value="d1">Samuel (Van - Available)</option>
                <option value="d2">David (Bike - On Trip)</option>
                <option value="d3">Alice (Truck - Available)</option>
              </select>
              <button class="btn-dispatch" onclick="dispatchOrder('ORD-102')">
                Dispatch
              </button>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="/wh_manager/orders/assign_to_driver.js"></script>
</body>

</html>
