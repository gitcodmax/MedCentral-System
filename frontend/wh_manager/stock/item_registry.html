<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Item Registry | Medical Logistics</title>

    <link rel="stylesheet" href="/wh_manager/stock/item_registry.css">
    <link rel="stylesheet" href="/wh_manager/sidebar.css">
    <link rel="stylesheet" href="/global.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>

    <div class="page-container">
        <nav class="sidebar"></nav>

        <div class="registry-container">
            <header class="logo-container"></header>

            <section class="form-panel">
                <div class="header">
                    <h2><i class="fas fa-plus-circle"></i> Register New Item</h2>
                    <p>Classify stock based on Admin-defined standards.</p>
                </div>

                <form id="itemForm">
                    <div class="input-grid">

                        <div class="form-group margin-set">
                            <label>Item Name</label>
                            <input type="text" placeholder="e.g. Amoxicillin 500mg" required>
                        </div>

                        <div class="form-group margin-set">
                            <label>SKU Code</label>
                            <input type="text" placeholder="REF-00123" required>
                        </div>

                        <div class="form-group">
                            <label>Category <small>(Admin Standard)</small></label>
                            <select>
                                <option>Antibiotics</option>
                                <option>Vaccines</option>
                                <option>Surgical Gear</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Storage Temp <small>(Admin Standard)</small></label>
                            <select>
                                <option>Ambient</option>
                                <option>CRT (Controlled Room Temp)</option>
                                <option>Refrigerated</option>
                                <option>Frozen</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>UOM <small>(Bulk Unit)</small></label>
                            <select>
                                <option>Carton</option>
                                <option>Box</option>
                                <option>Pallet</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Selling Unit <small>(Retail Unit)</small></label>
                            <select>
                                <option>Vial</option>
                                <option>Tablet</option>
                                <option>Strip</option>
                                <option>Single Item</option>
                            </select>
                        </div>

                        <div class="form-group margin-set">
                            <label>Price per Selling Unit (Ksh)</label>
                            <input type="number" placeholder="0.00" required>
                        </div>

                        <button type="submit" class="submit-btn">Add to Registry</button>   
                    </div>
                </form>
            </section>

            <section class="catalog-panel">
                <div class="catalog-header">
                    <div class="left-catalog-header">
                        <h3><i class="fas fa-list"></i> Current Catalog</h3>
                    </div>
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" placeholder="Search SKU/Name...">
                    </div>
                </div>

                <div class="table-scroll">
                    <table class="catalog-table">
                        <thead>
                            <tr>
                                <th>SKU</th>
                                <th>Name</th>
                                <th>UOM / Selling Unit</th>
                                <th>Temp</th>
                                <th>Price</th>
                                <th>Delete</th>
                            </tr>
                        </thead>
                        <tbody class="items-tbody">
                            <tr>
                                <td class="sku-code"><strong>SKU-101</strong></td>
                                <td>Insulin Glargine</td>
                                <td>Pack / Vial</td>
                                <td><span class="t-badge ref">Ref</span></td>
                                <td>1,250</td>
                                <td class="btn-td"><button class="delete-item-btn">DELETE</button></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </div>

    <script type="module" src="/wh_manager/stock/item_registry.js"></script>
</body>

</html>
