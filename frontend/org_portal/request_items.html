<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Request Items | Medical Portal</title>

  <link rel="stylesheet" href="/global.css">
  <link rel="stylesheet" href="/org_portal/sidebar.css">
  <link rel="stylesheet" href="/org_portal/org_portal_global.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/org_portal/request_items.css">
</head>

<body>

  <div class="app-container">

    <nav class="sidebar js-sidebar"></nav>

    <main class="app-content">
      <div class="main-content-logo"></div>

      <div class="app-grid-content">
        <section class="catalog-container">
          <div class="header-strip">
            <div class="search-bar">
              <i class="fas fa-search"></i>
              <input type="text" placeholder="Search item or SKU...">
            </div>
          </div>
  
          <div class="product-grid js-product-grid"></div>
        </section>
  
        <section class="order-summary">
          <div class="summary-header">
            <h3>Order Summary <span class="item-count-badge">2 Items</span></h3>
          </div>
  
          <div class="cart-list">
            <div class="cart-item">
              <div class="cart-item-info">
                <span class="cart-item-name">Saline Solution 500ml</span>
                <span class="cart-item-price">KES 1,200.00</span>
              </div>
              <div class="line-assignment">
                <label>Charge to Dept</label>
                <select class="dept-select-item">
                  <option>General Ward</option>
                  <option selected>ICU</option>
                  <option>Pharmacy</option>
                  <option>Emergency Room</option>
                </select>
              </div>
            </div>
  
            <div class="cart-item">
              <div class="cart-item-info">
                <div>
                  <span class="cart-item-name">Paracetamol 500mg</span>
                  <div class="cart-item-meta">100 Tablets × KES 4.50</div>
                </div>
                <span class="cart-item-price">KES 450.00</span>
              </div>
  
              <div class="line-assignment">
                <label>Assign to Dept</label>
                <select class="dept-select-item">
                  <option selected>General Ward</option>
                  <option>ICU</option>
                  <option>Pharmacy</option>
                </select>
              </div>
            </div>
          </div>
  
          <div class="summary-footer">
            <div class="total-line">
              <span>Estimated Total</span>
              <span class="total-price">KES 2,100.00</span>
            </div>
            <button class="btn-submit">Submit Requisition</button>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script type="module" src="/org_portal/request_items.js"></script>
</body>

</html>
