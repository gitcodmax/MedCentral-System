<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Request Items | Medical Portal</title>

  <link rel="stylesheet" href="/global.css">
  <link rel="stylesheet" href="/org_portal/sidebar.css">
  <link rel="stylesheet" href="/org_portal/org_portal_global.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/org_portal/request_items.css">
</head>

<body>

  <div class="app-container">

    <nav class="sidebar js-sidebar"></nav>

    <main class="app-content">
      <div class="main-content-logo"></div>

      <nav class="view-navigation">
        <div class="nav-tabs">
          <button class="nav-tab active" data-view="catalog">
            <i class="fas fa-th-large"></i>
            <span>Product Catalog</span>
          </button>

          <button class="nav-tab" data-view="summary">
            <i class="fas fa-clipboard-list"></i>
            <span>Order Summary</span>
            <span class="cart-badge" id="navCartCount">0</span>
          </button>
        </div>
      </nav>

      <div class="app-grid-content">
        <section class="catalog-container">
          <div class="filter-container">
            <div class="search-group">
              <label for="searchTerm">Search by Item Name/sku</label>
              <i class="fas fa-search search-icon"></i>
              <input type="text" id="catalogSearch" placeholder="Search by item name or SKU (e.g. MED-001)...">
            </div>

            <div class="filter-group">
              <div class="filter-item">
                <label for="tempFilter">Storage Temp</label>
                <select id="tempFilter">
                  <option value="all">All Temperatures</option>
                  <option value="ambient">Ambient</option>
                  <option value="crt">CRT</option>
                  <option value="refrigerated">Refrigerated</option>
                  <option value="frozen">Frozen</option>
                </select>
              </div>

              <div class="show-no-products">
                <p>Showing <span class="no-products">All</span> products</p>
              </div>

              <button class="btn-reset js-btn-reset" title="Reset Filters">
                <i class="fas fa-undo"></i>
              </button>
            </div>
          </div>

          <div class="product-grid js-product-grid"></div>

          <div class="no-match-container hidden js-no-match-found"></div>
        </section>
      </div>
    </main>
  </div>

  <script type="module" src="/org_portal/request_items.js"></script>
</body>

</html>
