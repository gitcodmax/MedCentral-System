<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order History | MedCentral</title>

  <link rel="stylesheet" href="/global.css">
  <link rel="stylesheet" href="/org_portal/sidebar.css">
  <link rel="stylesheet" href="/org_portal/org_portal_global.css">
  <link rel="stylesheet" href="/org_portal/ord_history.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>

<body>

  <div class="app-container">
    <nav class="sidebar js-sidebar"></nav>

    <main class="app-content">
      <div class="main-content-logo"></div>

      <section id="orderDetailsPage" class="view-section">
        <div class="page-header">
          <div>
            <h2>Requisition & Order History</h2>
            <p>Track the lifecycle of your medical supply requests.</p>
          </div>
        </div>

        <div class="table-toolbar">
          <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" placeholder="Search by ID or Department...">
          </div>
          <div class="filter-group">
            <select class="filter-select">
              <option>All Statuses</option>
              <option>Draft</option>
              <option>Approved / Unpaid</option>
              <option>Paid</option>
              <option>Delivered</option>
            </select>
            <button class="btn-export">
              <i class="fas fa-file-download"></i> Export CSV
            </button>
          </div>
        </div>

        <div class="table-container">
          <table class="orders-table js-ord-tbl">
            <thead>
              <tr>
                <th>Reference IDs</th>
                <th>Packages</th>
                <th>Date Initiated</th>
                <th>Payment Date</th>
                <th>Delivery Date</th>
                <th>Total Value</th>
                <th>Completed</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="orderTableBody"></tbody>
          </table>
        </div>

        <div id="packageDrawer" class="side-drawer">
          <div class="drawer-header">
            <div class="header-titles">
              <h2> <span class="no-pkg js-no-pkg"></span> Order Packages</h2>
              <p id="drawerRequestId"></p>          
            </div>
            <div class="header-titles-right">
              <button class="btn-close-drawer js-btn-close-drawer">&times;</button>
              <div class="total-items">Total Items: <span class="no-total-items js-no-total-items">3</span></div>
            </div>
          </div>

          <div class="drawer-body js-drawer-body"></div>
        </div>
      </section>
    </main>

  </div>

  <script type="module" src="/org_portal/ord_history.js"></script>
</body>

</html>
