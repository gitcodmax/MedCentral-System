<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedCentral | Receive Stock Form</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/global.css">
    <link rel="stylesheet" href="receive_stock.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <div class="form-wrapper">
        <header class="form-header">
            <h1 class="main-title">Enter the following details to receive new stock</h1>
            <i>All the fields are required!!</i>
        </header>

        <form id="receiveStockForm">

            <div class="form-section js-delivery-details">
                <h2 class="section-title">Delivery Details</h2>
                <div class="form-grid">
                    <div class="input-group">
                        <label for="supplierName">Supplier Name:</label>
                        <input type="text" id="supplierName" required>
                    </div>
                    <div class="input-group">
                        <label for="deliveryNote">Delivery Note Number:</label>
                        <input type="text" id="deliveryNote" required>
                    </div>
                    <div class="input-group">
                        <label for="deliveryDateTime">Delivery Date and Time:</label>
                        <input type="datetime-local" id="deliveryDateTime" required>
                    </div>
                </div>
            </div>

            <div id="item-details-section">
                <div class="form-section js-form-section-0">
                    <h2 class="section-title">Item Details</h2>

                    <div class="item-entry-card js-item-entry-card" id="item-entry-card-0">
                        <div class="form-grid item-identity-grid">
                            <div class="input-group">
                                <label for="itemCode">Item Code:</label>
                                <input type="text" id="itemCode-0" required>
                            </div>

                            <div class="input-group">
                                <label for="itemName">Item Name:</label>
                                <input type="text" id="itemName-0">
                            </div>
                            <div class="input-group">
                                <label for="batchNo">Batch/Lot No.:</label>
                                <input type="text" id="batchNo-0" required>
                            </div>
                            <div class="input-group">
                                <label for="expiryDate">Expiry Date:</label>
                                <input type="date" id="expiryDate-0" required>
                            </div>

                            <div class="input-group">
                                <label for="itemCategory">Item Category:</label>
                                <select class="itemCategory" id="itemCategory-0" required>
                                    <option value="">Select Category</option>
                                    <option value="pharmaceutical_packaged">Pharmaceuticals (Packaged)</option>
                                    <option value="pharmaceutical_liquid">Pharmaceuticals (Liquid)</option>
                                    <option value="medical_device">Medical Device / Equipment</option>
                                    <option value="bulk_chemical">Bulk Chemical / Raw Material</option>
                                    <option value="consumables">General Consumables / Supplies</option>
                                    <option value="rolled_goods">Rolled Goods / Tubing</option>
                                </select>
                            </div>

                            <div class="input-group">
                                <label for="unitOfMeasure">Unit of Measure:</label>
                                <select class="unitOfMeasure" id="unitOfMeasure-0" required>
                                    <option value="">Select Unit</option>
                                    <option value="BOX">Box</option>
                                    <option value="CARTON">Carton/Case</option>
                                    <option value="VIAL">Vial</option>
                                    <option value="BOTTLE">Bottle</option>
                                    <option value="KIT">Kit</option>
                                    <option value="EACH">Each (Unit)</option>
                                </select>
                            </div>

                            <div class="input-group">
                                <label for="qtyDelivered">Quantity Delivered:</label>
                                <input type="number" id="qtyDelivered-0" required min="1">
                            </div>
                        </div>
                    </div>

                    <div class="center-button-container">
                        <!-- <button type="button" id="clearDetailsBtn" data-item-index="0"
                            class="clear-details-btn js-clear-details-btn">Clear Item</button> -->
                        <button type="button" id="addItemBtn" data-item-index="0"
                            class="add-item-btn js-add-item-btn">Add Another
                            Item</button>
                    </div>
                </div>
            </div>

            <div class="center-button-container">
                <button type="button" id="save-details-btn" class="submit-btn confirm-btn js-confirm-btn">Save Details</button>
            </div>
        </form>
    </div>

    <script src="receive_stock.js"></script>

</body>

</html>
