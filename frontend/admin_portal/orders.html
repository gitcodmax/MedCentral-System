<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order & Request Management | Central Warehouse</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <link rel="stylesheet" href="/global.css">
  <link rel="stylesheet" href="/admin_portal/sidebar.css">
  <link rel="stylesheet" href="/admin_portal/admin_portal_global.css">
  <link rel="stylesheet" href="/admin_portal/orders.css">
</head>

<body>

  <div class="app-container">
    <div class="sidebar" id="sidebar"></div>

    <div class="main-wrapper">
      <header class="top-header" id="topHeader"></header>

      <main class="content">
        <section class="filter-section">
          <div class="filter-grid">
            <div class="search-box">
              <i class="fas fa-search"></i>
              <input type="text" placeholder="Search by Reference ID or Hospital Name">
            </div>

            <div class="filter-group">
              <input type="date" class="input-field" title="Request Date">

              <select class="input-field">
                <option value="">Completion: All</option>
                <option value="full">Completed</option>
                <option value="partial">Partially Completed</option>
                <option value="none">Not Completed</option>
              </select>

              <select class="input-field">
                <option value="newest">Newest First</option>
                <option value="oldest">Oldest First</option>
              </select>

              <label class="toggle-container">
                <input type="checkbox">
                <span class="toggle-label">Show Rejected</span>
              </label>
            </div>
          </div>
        </section>

        <main class="table-container">
          <table class="order-table">
            <thead>
              <tr>
                <th>Reference IDs</th>
                <th>Hospital Name</th>
                <th>Request Date</th>
                <th>Packages</th>
                <th>Total Items</th>
                <th>Completed</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="ordersTbody"></tbody>
          </table>

          <div class="modal-overlay" id="orderDetailsOverlay">
            <div class="modal-card detail-modal-wide">
              <div class="modal-header order-detail-header">
                <div class="header-main">
                  <div class="id-badge-group">
                    <span class="req-id-view-overlay" id="reqIdOverlay"></span>
                    <i class="fas fa-arrow-right"></i>
                    <span class="ord-id-view-overlay" id="ordIdOverlay"></span>
                  </div>
                  <h2 id="hosNameOv"></h2>
                  <div class="header-meta">
                    <span><i class="far fa-calendar-alt"></i> Requested: <strong id="reqDateOv"></strong></span>
                    <span><i class="far fa-credit-card"></i> Paid: <strong id="payDateOv"></strong></span>
                    <span><i class="fas fa-box"></i> <strong id="pkgsCount"></strong> | <strong id="itemsCount"></strong> Total</span>
                  </div>
                </div>
                <button class="modal-close-btn js-btn-close-overlay">&times;</button>
              </div>

              <div class="ord-details-modal-body">
                <div class="package-list" id="pkgListOverlay"></div>
              </div>
            </div>
          </div>
        </main>
      </main>
    </div>
  </div>

  <script type="module" src="/admin_portal/orders.js"></script>
</body>

</html>
